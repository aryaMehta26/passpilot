<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#16222e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76b900"/>
      <stop offset="1" stop-color="#2f80ed"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#3e4c5a">
    <text x="880" y="70">define i32 @main() {</text>
    <text x="900" y="95">%v = load double, ptr %a</text>
    <text x="900" y="120">br label %loop</text>
    <text x="880" y="145">loop:</text>
    <text x="900" y="170">%x = fmul &lt;4 x double&gt; %v, %w</text>
    <text x="900" y="195">br i1 %c, label %loop, label %exit</text>
    <text x="880" y="220">}</text>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round">
    <path d="M70 232 h120 l26 -30 h96 l26 30 h120 l26 -30 h96"/>
  </g>
  <g fill="#76b900">
    <circle cx="70" cy="232" r="6"/><circle cx="216" cy="202" r="6"/><circle cx="338" cy="232" r="6"/>
    <circle cx="484" cy="202" r="6"/><circle cx="580" cy="202" r="6"/>
  </g>
  <text x="66" y="118" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff">PassPilot</text>
  <text x="70" y="160" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#b8c4d0">AI agents that tune LLVM pipelines from compiler feedback</text>
</svg>
